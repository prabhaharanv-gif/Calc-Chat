# One-click deploy on Render.com: the Node server also hosts the web app.
# Use a SINGLE instance only (messages live in RAM, so no scaling out).
services:
  - type: web
    name: calc-chat
    runtime: node
    plan: starter        # free plans sleep when idle, which would drop in-memory chats
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /
